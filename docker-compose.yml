services:
  streamlit:
    build: .
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./cache:/app/cache
    restart: unless-stopped

  api:
    build: .
    command:
      - uvicorn
      - biointel.api.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports
      - ./cache:/app/cache
    restart: unless-stopped
