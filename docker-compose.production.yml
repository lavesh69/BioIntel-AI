services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biointel}
      POSTGRES_USER: ${POSTGRES_USER:-biointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - biointel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biointel} -d ${POSTGRES_DB:-biointel}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - biointel_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - biointel_objects:/data
    ports:
      - "127.0.0.1:9001:9001"
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      options: {max-size: "10m", max-file: "3"}

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["uvicorn", "biointel.api.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips=127.0.0.1"]
    environment: &biointel_environment
      BIOINTEL_ENV: production
      BIOINTEL_DATABASE_URL: postgresql://${POSTGRES_USER:-biointel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biointel}
      BIOINTEL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      BIOINTEL_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      BIOINTEL_API_CLIENTS_JSON: ${BIOINTEL_API_CLIENTS_JSON:?Set BIOINTEL_API_CLIENTS_JSON for production API access}
      BIOINTEL_TRUSTED_HOSTS: ${BIOINTEL_TRUSTED_HOSTS:-localhost,127.0.0.1,api}
      BIOINTEL_OFFICIAL_HOSTS_ONLY: "1"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports
      - ./data:/app/data
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    init: true
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options: {max-size: "20m", max-file: "5"}

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment: *biointel_environment
    depends_on:
      api: {condition: service_healthy}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./models:/app/models:ro
      - ./reports:/app/reports
      - ./data:/app/data
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    init: true
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      options: {max-size: "20m", max-file: "5"}

  worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    command: ["python", "scripts/run_local_worker.py", "--worker-id", "production-worker", "--poll-seconds", "5"]
    environment: *biointel_environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      api: {condition: service_healthy}
    volumes:
      - ./models:/app/models
      - ./reports:/app/reports
      - ./data:/app/data
      - ./cache:/app/cache
    init: true
    pids_limit: 512
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      options: {max-size: "20m", max-file: "5"}

volumes:
  biointel_postgres:
  biointel_redis:
  biointel_objects:
