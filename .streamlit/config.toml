[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#07111F"
secondaryBackgroundColor = "#111C30"
textColor = "#EAF2FF"
linkColor = "#38BDF8"
codeTextColor = "#C7D2FE"
codeBackgroundColor = "#0B172A"
borderColor = "#263A59"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontSizes = ["34px", "26px", "21px", "17px", "15px", "13px"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
linkUnderline = false
redColor = "#EF4444"
orangeColor = "#F59E0B"
yellowColor = "#EAB308"
greenColor = "#22C55E"
blueColor = "#3B82F6"
violetColor = "#8B5CF6"
grayColor = "#94A3B8"
chartCategoricalColors = ["#22D3EE", "#3B82F6", "#8B5CF6", "#22C55E", "#F59E0B", "#EF4444", "#94A3B8"]
chartSequentialColors = ["#07111F", "#0B1E34", "#0E2B49", "#123B60", "#16527B", "#176B96", "#1885AE", "#1CA1C5", "#20BCDA", "#67E8F9"]
dataframeBorderColor = "#263A59"
dataframeHeaderBackgroundColor = "#13213A"

[theme.sidebar]
backgroundColor = "#0A1628"
secondaryBackgroundColor = "#101F36"
textColor = "#EAF2FF"
primaryColor = "#22D3EE"
borderColor = "#263A59"

[server]
headless = true
maxUploadSize = 1024
maxMessageSize = 1024
enableXsrfProtection = true
fileWatcherType = "none"
runOnSave = false
enableWebsocketCompression = true

[runner]
fastReruns = true
magicEnabled = false
enforceSerializableSessionState = false

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
showErrorDetails = "none"
toolbarMode = "minimal"