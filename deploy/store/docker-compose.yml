name: biointel-store-production

x-biointel-environment: &biointel-environment
  BIOINTEL_ENV: production
  BIOINTEL_ENVIRONMENT: production
  BIOINTEL_PUBLIC_URL: ${BIOINTEL_PUBLIC_URL:?Set BIOINTEL_PUBLIC_URL}
  BIOINTEL_CORS_ORIGINS: ${BIOINTEL_CORS_ORIGINS:?Set BIOINTEL_CORS_ORIGINS}
  BIOINTEL_TRUSTED_HOSTS: ${BIOINTEL_TRUSTED_HOSTS:?Set BIOINTEL_TRUSTED_HOSTS}
  BIOINTEL_OFFICIAL_HOSTS_ONLY: "1"
  BIOINTEL_UI_AUTH_REQUIRED: "1"
  BIOINTEL_UI_USERS_JSON: ${BIOINTEL_UI_USERS_JSON:?Set BIOINTEL_UI_USERS_JSON}
  BIOINTEL_API_CLIENTS_JSON: ${BIOINTEL_API_CLIENTS_JSON:?Set BIOINTEL_API_CLIENTS_JSON}
  BIOINTEL_DEFAULT_TENANT: ${BIOINTEL_DEFAULT_TENANT:-default}
  BIOINTEL_DATABASE_URL: postgresql://${POSTGRES_USER:-biointel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-biointel}
  BIOINTEL_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  BIOINTEL_OBJECT_STORAGE_ENDPOINT: http://minio:9000
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biointel}
      POSTGRES_USER: ${POSTGRES_USER:-biointel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [biointel_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biointel} -d ${POSTGRES_DB:-biointel}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes: [biointel_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes: [biointel_objects:/data]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.production
      args: {BUILD_VERSION: "15.6.0"}
    command: ["uvicorn", "biointel.api.main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips=*" ]
    environment: *biointel-environment
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
    volumes:
      - ../../models:/app/models:ro
      - ../../data:/app/data
      - ../../reports:/app/reports
      - ../../cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  streamlit:
    build:
      context: ../..
      dockerfile: Dockerfile.production
      args: {BUILD_VERSION: "15.6.0"}
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--server.enableXsrfProtection=true"]
    environment: *biointel-environment
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ../../models:/app/models:ro
      - ../../data:/app/data
      - ../../reports:/app/reports
      - ../../cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  caddy:
    image: caddy:2.10.0-alpine
    environment:
      BIOINTEL_PUBLIC_DOMAIN: ${BIOINTEL_PUBLIC_DOMAIN:?Set BIOINTEL_PUBLIC_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      streamlit: {condition: service_healthy}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

volumes:
  biointel_postgres:
  biointel_redis:
  biointel_objects:
  caddy_data:
  caddy_config:
