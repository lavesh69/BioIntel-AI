{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "biointel.fullname" . }}-secrets
  labels:
    {{- include "biointel.labels" . | nindent 4 }}
type: Opaque
stringData:
  BIOINTEL_DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  BIOINTEL_REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | quote }}
  BIOINTEL_OBJECT_STORAGE_ENDPOINT: {{ required "secrets.objectStorageEndpoint is required" .Values.secrets.objectStorageEndpoint | quote }}
  AWS_ACCESS_KEY_ID: {{ required "secrets.objectStorageAccessKey is required" .Values.secrets.objectStorageAccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "secrets.objectStorageSecretKey is required" .Values.secrets.objectStorageSecretKey | quote }}
  BIOINTEL_API_CLIENTS_JSON: {{ required "secrets.apiClientsJson is required" .Values.secrets.apiClientsJson | quote }}
{{- end }}
