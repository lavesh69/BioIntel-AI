apiVersion: v1
kind: Service
metadata:
  name: {{ include "biointel.fullname" . }}-api
  labels:
    {{- include "biointel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.api.type }}
  selector:
    {{- include "biointel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: {{ .Values.services.api.port }}, targetPort: http, protocol: TCP}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "biointel.fullname" . }}-streamlit
  labels:
    {{- include "biointel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.services.streamlit.type }}
  selector:
    {{- include "biointel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: streamlit
  ports:
    - {name: http, port: {{ .Values.services.streamlit.port }}, targetPort: http, protocol: TCP}
