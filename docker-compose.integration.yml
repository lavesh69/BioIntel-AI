services:
  postgres:
    image: postgres:17.5-alpine
    environment: {POSTGRES_DB: biointel, POSTGRES_USER: biointel, POSTGRES_PASSWORD: integration}
    healthcheck: {test: [CMD-SHELL, "pg_isready -U biointel"], interval: 2s, timeout: 2s, retries: 20}
  redis:
    image: redis:7.4.2-alpine
    healthcheck: {test: [CMD, redis-cli, ping], interval: 2s, timeout: 2s, retries: 20}
  integration-tests:
    build: {context: ., dockerfile: Dockerfile.production}
    command: [pytest, -q, tests/integration]
    environment: {PYTHONPATH: /app/src, BIOINTEL_ENV: test}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
