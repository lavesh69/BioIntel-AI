<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BioIntel Calls WebRTC client</title><style>
:root{color-scheme:dark}body{font:14px system-ui;margin:16px;background:#0b1220;color:#e5eefc}button,input{padding:9px;margin:4px;border-radius:8px;border:1px solid #50627d;background:#142038;color:inherit}button:focus,input:focus{outline:3px solid #5fb3ff}.bar{display:flex;flex-wrap:wrap;gap:5px}.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}video{width:100%;background:#02050a;border-radius:12px;min-height:180px}.status{padding:10px;border-left:4px solid #5fb3ff;margin:8px 0}.warn{border-color:#ffb454}.tile{position:relative}.tile span{position:absolute;left:8px;bottom:8px;background:#000b;padding:4px 7px;border-radius:6px}
</style></head><body>
<h2>BioIntel peer-to-peer call</h2><div class="status warn" id="secure">Camera and microphone require HTTPS except on loopback. TURN is not assumed until relay diagnostics prove it.</div>
<div class="bar"><input id="api" aria-label="API base URL" value="/api/v1/connect"><input id="call" aria-label="Call ID" placeholder="Call ID"><button id="join">Pre-join devices</button><button id="connect" disabled>Connect</button><button id="mute" disabled>Mute</button><button id="camera" disabled>Camera off</button><button id="share" disabled>Share screen</button><button id="leave" disabled>Leave</button><button id="end" disabled>End for all</button></div>
<div class="status" id="status" role="status" aria-live="polite">Not connected.</div><div class="videos"><div class="tile"><video id="local" autoplay muted playsinline></video><span>You</span></div><div id="remotes" class="videos"></div></div>
<script>
const $=id=>document.getElementById(id), peers=new Map(); let localStream, screenStream, me, timer, cursor='';
const api=(path,opt={})=>fetch($('api').value.replace(/\/$/,'')+path,{credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}).then(async r=>{if(!r.ok)throw Error((await r.text())||r.status);return r.json()});
const say=(m,bad=false)=>{$('status').textContent=m;$('status').className='status'+(bad?' warn':'')};
async function send(type,signal,to){await api(`/calls/${encodeURIComponent($('call').value)}/signals`,{method:'POST',body:JSON.stringify({signal_type:type,signal,recipient_id:to||null})})}
async function peer(id,initiator=false){if(peers.has(id))return peers.get(id);const ice=await api('/calls/ice-configuration');const pc=new RTCPeerConnection(ice);peers.set(id,pc);localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)send('ice-candidate',e.candidate.toJSON(),id).catch(console.error)};pc.ontrack=e=>{let v=document.getElementById('v-'+id);if(!v){const d=document.createElement('div');d.className='tile';v=document.createElement('video');v.id='v-'+id;v.autoplay=true;v.playsInline=true;const s=document.createElement('span');s.textContent='Participant';d.append(v,s);$('remotes').append(d)}v.srcObject=e.streams[0]};pc.onconnectionstatechange=()=>say(`${id.slice(0,8)}: ${pc.connectionState}`);if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await send('offer',pc.localDescription,id)}return pc}
async function poll(){try{const data=await api(`/calls/${encodeURIComponent($('call').value)}/signals?after_created_at=${encodeURIComponent(cursor)}`);for(const e of data.items){cursor=e.created_at_utc>cursor?e.created_at_utc:cursor;const pc=await peer(e.sender_id,false);if(e.signal_type==='offer'){await pc.setRemoteDescription(e.signal);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await send('answer',pc.localDescription,e.sender_id)}else if(e.signal_type==='answer')await pc.setRemoteDescription(e.signal);else if(e.signal_type==='ice-candidate')await pc.addIceCandidate(e.signal);else if(e.signal_type==='meeting-ended'){say('Host ended the call.',true);await stop(false)}}}catch(e){say('Signaling error: '+e.message,true)}}
async function stop(notify=true){clearInterval(timer);for(const p of peers.values())p.close();peers.clear();localStream?.getTracks().forEach(t=>t.stop());screenStream?.getTracks().forEach(t=>t.stop());if(notify)await api(`/calls/${encodeURIComponent($('call').value)}/leave`,{method:'POST'});say('Call ended locally.');}
$('join').onclick=async()=>{try{localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{width:{ideal:1280},frameRate:{ideal:24,max:30}}});$('local').srcObject=localStream;$('connect').disabled=false;say('Preview ready. Confirm Connect to enter.')}catch(e){say('Device permission failed: '+e.message,true)}};
$('connect').onclick=async()=>{try{const state=await api(`/calls/${encodeURIComponent($('call').value)}`);me=state.current_user_id;if(state.state!=='active')throw Error('Call is not active');for(const p of state.participants)if(p.user_id!==me&&p.invitation_state==='accepted'&&p.state==='active'&&me.localeCompare(p.user_id)<0)await peer(p.user_id,true);timer=setInterval(poll,750);['mute','camera','share','leave','end'].forEach(x=>$(x).disabled=false);say(`Connected using ${state.capabilities.topology}.`)}catch(e){say(e.message,true)}};
$('mute').onclick=()=>{const t=localStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'Mute':'Unmute';send('media-state',{audio:t.enabled,video:localStream.getVideoTracks()[0]?.enabled})}};
$('camera').onclick=()=>{const t=localStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('camera').textContent=t.enabled?'Camera off':'Camera on';send('media-state',{audio:localStream.getAudioTracks()[0]?.enabled,video:t.enabled})}};
$('share').onclick=async()=>{try{screenStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});const track=screenStream.getVideoTracks()[0];for(const pc of peers.values()){const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(track)}await send('screen-share',{enabled:true});track.onended=async()=>{const cam=localStream.getVideoTracks()[0];for(const pc of peers.values()){const sender=pc.getSenders().find(s=>s.track?.kind==='video');if(sender)await sender.replaceTrack(cam)}await send('screen-share',{enabled:false})}}catch(e){say('Screen share failed: '+e.message,true)}};
$('leave').onclick=()=>stop(true).catch(e=>say(e.message,true));$('end').onclick=async()=>{await send('meeting-ended',{});await api(`/calls/${encodeURIComponent($('call').value)}/end`,{method:'POST'});await stop(false)};
if(!window.isSecureContext)say('Insecure context: media capture is blocked outside loopback.',true);
</script></body></html>
