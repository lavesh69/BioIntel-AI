policy_id: BIOINTEL-IVAX-1.0
purpose: Convert every authentic external-validation blocker into a controlled execution task.
controls:
  never_override_authentic_score: true
  external_owner_required: true
  independent_reviewer_separation_required: true
  checksum_manifest_required: true
  projection_is_not_evidence: true
  test_or_demo_evidence_never_scores: true
  regulator_or_institution_issued_evidence_required_for_claims: true
release_boundary:
  framework_readiness_claim: allowed_when_qualified
  clinical_or_pharma_validation_claim: blocked_until_authentic_score_is_10_and_program_is_completed
  patient_care_claim: blocked_without_applicable_authorization_and_institutional_approval
