portfolio:
  registry_path: reports/projects.sqlite3
  valid_statuses:
    - Planning
    - Active
    - Validation
    - Paused
    - Completed
    - Archived
  valid_priorities:
    - Low
    - Medium
    - High
    - Critical
governance:
  milestone_statuses:
    - Planned
    - In Progress
    - Blocked
    - Completed
    - Cancelled
  decision_statuses:
    - Proposed
    - Approved
    - Superseded
    - Reversed
  gate_statuses:
    - Pending
    - Conditional
    - Approved
    - Rejected
  standard_gates:
    - Data readiness
    - Model validation
    - External validation
    - Reproducibility
    - Release approval
  registry_path: reports/projects.sqlite3
reproducibility:
  project_package_version: "1.0"
  max_package_mb: 500
  include_model_files_by_default: false
audit:
  chain_version: "1.0"
  path: reports/audit.jsonl
  verify_in_diagnostics: true
operations:
  activity_state_path: reports/activity_state.json
  overdue_alerts: true
  due_soon_days: 14
reports:
  generated_directory: reports/generated
  workspace_html: true
  workspace_json: true
  include_projects: true
  include_executive_summary: true
  include_governance: true
  include_audit_integrity: true
training:
  random_seed: 42
  test_fraction: 0.20
  validation_fraction: 0.15
  conformal_alpha: 0.10
  bootstrap_iterations: 200
dti:
  fingerprint_radius: 2
  fingerprint_bits: 256
  use_chirality: true
batch_prediction:
  default_chunk_size: 100
  max_chunk_size: 1000
  max_rows: 10000
  checkpoint_directory: reports/batch_jobs
datasets:
  registry_path: reports/datasets.sqlite3
  max_upload_mb: 1024
models:
  catalog_path: models/catalog.json
  lifecycle_states:
    - candidate
    - active
    - archived
chembl:
  max_records: 10000
  timeout_seconds: 20
  starter_recipes: data/recipes/chembl_starter_targets.csv
cache:
  external_ttl_seconds: 86400
  stale_fallback: true
workspace:
  max_files: 5000
  max_uncompressed_mb: 250
api:
  host: 127.0.0.1
  port: 8000
  max_request_bytes: 26214400
  authentication_required: false

coverage:
  version: 15.3.0
  manifest: data/coverage/coverage_manifest.json
  sequence_records: 800
  comparison_pairs: 180
  molecules: 1000
  external_validation_rows: 14000
  lookup_starters: 20
  demo_projects: 12
  demo_milestones: 48
  demo_decisions: 12
  demo_gates: 60
  verify_in_diagnostics: true

optimization:
  phase: 1
  file_signature_invalidation: true
  persistent_integrity_cache: true
  model_cache_max_entries: 12
  csv_cache_max_entries: 32
  json_cache_max_entries: 64
  large_preview_rows: 100
  lazy_large_downloads: true

databases:
  count: 7
  journal_mode: WAL
  busy_timeout_ms: 30000
  foreign_keys: true
  mmap_size_bytes: 268435456
  knowledge_path: reports/knowledge.sqlite3
  analytics_path: reports/analytics.sqlite3
  assets_path: reports/assets.sqlite3
  dataset_registry_path: reports/datasets.sqlite3
  experiment_registry_path: reports/experiments.sqlite3
  project_registry_path: reports/projects.sqlite3
  internet_download_registry_path: reports/internet_downloads.sqlite3
  seed_script: SEED_PROFESSIONAL_DATABASES_WINDOWS.bat
  verify_in_diagnostics: true
professional_ui:
  version: 15.4.0
  database_cards: true
  command_bars: true
  insight_callouts: true
  responsive_breakpoints: true
  density_indicators: true

internet:
  enabled: true
  outbound_only: true
  public_https_allowed: true
  official_hosts_only: false
  resolve_dns_before_request: true
  timeout_seconds: 30
  retries: 2
  max_download_mb: 250
  max_pdb_batch_entries: 50
  download_directory: data/internet_downloads
  registry_path: reports/internet_downloads.sqlite3
  block_private_networks: true
  block_executable_files: true
  auto_extract_archives: false
  providers:
    - RCSB PDB
    - PubChem
    - UniProt
    - ChEMBL
    - Public HTTPS

chemistry_directory:
  compound_name_directory: data/chemistry/common_compound_directory_5000.csv
  compound_name_rows: 5000
  curated_common_names: 59
  online_name_provider: PubChem PUG REST
  registry_names_are_labelled: true

evidence:
  registry_path: reports/evidence.sqlite3
  real_data_directory: data/real_evidence
  require_licence_coverage: 1.0
  require_review_coverage: 1.0
  minimum_mean_quality: 0.55
  strict_dataset_hash_binding: true
  synthetic_models_demo_only: true

documents:
  history_path: reports/document_history.sqlite3
  output_directory: data/document_extractions
  max_file_mb: 100
  max_rows_per_table: 50000
  max_columns: 256
  allow_macro_workbooks: false
  allow_embedded_objects: false
  keep_source_by_default: false
  default_ocr_mode: auto
  default_ocr_language: eng
  ocr_review_confidence: 0.70
  duplicate_policy: warn
  full_text_search: true
  scientific_entity_extraction: rule_based_v1
  sensitive_data_detection: true
  soft_delete_days_before_purge: 30
  failed_run_retention_days: 90
  supported_extensions:
    - pdf
    - xlsx
    - xls
    - xlsm
    - docx
    - csv
    - tsv
    - txt
    - md
    - html
    - json
    - xml
    - yaml
    - pptx
    - odt
    - ods
  export_formats:
    - xlsx
    - docx
    - pdf
    - json
    - csv_zip
    - bundle_zip
